name: TimeTracker
options:
  bundleIdPrefix: com.antigravity
  minimumXcodeGenVersion: 2.0.0
targets:
  TimeTracker:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        LSUIElement: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
